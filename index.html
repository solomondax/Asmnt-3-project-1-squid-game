<!DOCTYPE html>

<head>

</head>
<body>
  <div class="main">
    <nav class="nav-bar">

      <div>
        <img class="logo" src="./Assets/s-ts.png" alt="Squid Game Logo">
      </div>
      <!-- navigation pages -->
      <div>
        <ul style="list-style-type: none; display: flex; gap: 25px;  font-size: 18px;font-family: Arial, sans-serif;">
          <li><a >About</a></li>
          <li><a>Watch Now</a></li>
          <li><a >Actions</a></li>
          <li><a>Content</a></li>

      </div>
    
      <!-- humberg icon -->
      <div>
        <img  style=" height: 100px;" src="./Assets/humberger.png" alt="Humberg Icon"/>

    </nav>
      <p class="p-tag"></p>
      <div class="details-card">
        <img class="squid-game-logo" src="./Assets/s-t.png" alt="Squid Game Logo">
        <p class="para-tag">Action / Thriller / Drama Series Directed by Dong-Hunk Hwank<br> Season 1:9 Episodes</p>
        <div style="padding-top: 20px;">
          <button class="watch-now-btn">Watch Now</button>

        <div style="background-color: red;height:100px; width:1px; border-radius: 2px; writing-mode: vertical-rl"></div>

      <img class="bottom-card-img" src="./Assets/s-card-pic.gif" alt="Squid Game Characters">

      <img class="bottom-card-img" src="./Assets/scard3.webp" alt="Squid Game Characters">
    </div>
    <div class="social-m">
